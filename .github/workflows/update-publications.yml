name: Update Publications

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - '.github/scripts/fetch_publications.py'  # Update when script changes

jobs:
  update-publications:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Create directories if needed
      run: |
        mkdir -p _pages
        mkdir -p data
        
    - name: Fetch publications from PubMed
      run: python .github/scripts/fetch_publications.py
      
    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update publications from PubMed [skip ci]" && git push)