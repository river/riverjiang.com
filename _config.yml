# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site configuration - defines the site title, URL, and base URL
# change the baseurl if you're deploying to a subdirectory
title:               River Jiang
url:                 https://riverjiang.com
baseurl:             ''
permalink:           /:year/:title/

# Page collections - defines a "pages" collection that processes markdown files
# from the _pages/ directory into web pages with clean URLs like /about/ and /publications/
collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: page

# About/contact (used in xml feed)
author:
  name:              River Jiang

# Exclude from processing.
exclude:
  - .git
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock

# compress html
compress_html:
  comments: all